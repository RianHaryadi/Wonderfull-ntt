name: Deploy to Server

on:
  push:
    branches:
      - main # atau master, sesuaikan dengan nama branch utama Anda

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: SSH and Deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # BAGIAN DEBUGGING DITEMPATKAN DI ATAS
          echo "Mencoba melakukan debug pada host..."
          echo "Host yang terbaca adalah: ${{ secrets.SSH_HOST }}"
          echo "Debug selesai, melanjutkan deployment..."
          
          # BAGIAN DEPLOYMENT ASLI
          cd /home/wonderfull-ntt.my.id/public_html
          git pull origin main
          
          # OPSIONAL: Jalankan perintah lain yang spesifik untuk Laravel
          echo "🚀 Deployment finished, running Laravel commands..."
          composer install --no-interaction --prefer-dist --optimize-autoloader
          php artisan migrate --force
          php artisan optimize:clear    